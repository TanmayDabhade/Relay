name: CI

# The Tauri app only. `landing-page/` is an independent Next.js project with its own tooling,
# so changes confined to it don't trigger this workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "landing-page/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "landing-page/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `node --test tests/*.test.ts` relies on Node's built-in TypeScript type stripping.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: node --test tests/*.test.ts

  rust:
    name: Rust (fmt, clippy, tests)
    # macOS only: the app targets macOS (Terminal.app + AppleScript attach), and macOS runners
    # ship the WebKit system frameworks Tauri links against, so no apt setup is needed.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --check

      # `tauri::generate_context!` embeds `build.frontendDist` (../dist) at compile time and
      # fails if it's missing. The Rust tests don't exercise the UI, so a placeholder is enough
      # and keeps this job independent of the frontend build.
      - name: Stub frontend dist
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      # Warnings are reported but not fatal yet — there is existing dead code to clean up first.
      # Tighten to `-- -D warnings` once `cargo clippy --all-targets` is clean.
      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Tests
        run: cargo test --locked
